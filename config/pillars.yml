# Science-track 内容栏目、领域、研究任务与动作定义。
# 栏目回答“讲什么”，action 回答“在哪里做什么”；source 不再强制决定栏目。

columns:
  C1:
    name: Problem-aware｜难题求解
    scrapable: true
    target_signal: [心智, 收藏, 曝光]
    keywords: [open problem, hard problem, experimental design, next experiment, uncertainty, conflicting evidence, decision]

  C2:
    name: Product-aware｜验证拆解 / 反 AI 幻觉
    scrapable: true
    target_signal: [收藏, 评论]
    keywords: [unsupported conclusion, evidence mismatch, source mismatch, wrong result, overclaim, verification gap, missing evidence]

  C3:
    name: Before It Becomes Official｜定稿之前
    scrapable: true
    target_signal: [心智, 收藏]
    keywords: [draft, consultation, request for comment, open funding, proposed standard, evidence gap, research recommendation]

  C4:
    name: Worldview｜Big Idea 世界观
    scrapable: false
    note: 内部物料仅由 Selene 提供；repo 不保存内部内容。

  C5:
    name: Claim vs Record｜公开说法 vs 正式记录
    scrapable: true
    target_signal: [收藏, 评论]
    keywords: [official record, registry, stated endpoint, disclosed result, updated status, public claim]

  C6:
    name: Social Proof｜#ApodexSolvers
    scrapable: false
    note: 内部 UGC 仅由 Selene 提供并确认公开范围。

  C8:
    name: Engagement｜圈内接话
    scrapable: true
    target_signal: [曝光, profile_click]
    note: 展示层栏目；底层 action 仍拆成 X reply、X quote、Reddit reply 和原创选题。

domains:
  life_sciences:
    keywords: [biology, biomedical, neuroscience, genomic, genetics, protein, cell, assay, clinical, drug, therapeutic]
  chemistry_materials_energy:
    keywords: [chemistry, chemical, catalyst, materials, battery, energy, synthesis, molecule]
  scientific_computing:
    keywords: [scientific computing, simulation, analysis pipeline, dataset, statistics, model, database, software]
  physics_earth_space:
    keywords: [physics, astronomy, climate, earth science, geoscience, measurement, observatory]
  engineering_robotics:
    keywords: [engineering, robotics, autonomous lab, instrument, control system, hardware]

research_tasks:
  hypothesis_formation:
    keywords: [hypothesis, mechanism, causal, explanation]
  experiment_design:
    keywords: [experimental design, next experiment, assay, protocol, control group, endpoint]
  evidence_conflict:
    keywords: [conflicting evidence, conflicting results, discrepancy, inconsistent, disagreement]
  data_tool_integration:
    keywords: [pipeline, database, tool, dataset, integration, workflow]
  ambiguous_result:
    keywords: [unexpected result, failed experiment, ambiguous, troubleshooting, not working]
  next_best_action:
    keywords: [next step, prioritize, which method, what would you do, decision]
  scope_boundary:
    keywords: [limitation, boundary, generalize, uncertainty, confidence]
  expert_calibration:
    keywords: [expert judgment, calibration, review criteria, decision rule]

actions:
  original_post:
    platforms: [x, reddit, rss, web]
  x_reply:
    platforms: [x]
  x_quote:
    platforms: [x]
  reddit_reply:
    platforms: [reddit]
  watch_only:
    platforms: [x, reddit, rss, web]

audience:
  name: Apodex4Science
  keywords: [research lab, scientist, investigator, laboratory, experiment, scientific, biology, chemistry, materials, physics, clinical]

exclude:
  - name: 学术诚信与出版争议
    reason: 当前科学内容线不做诚信审判、撤稿追踪、作者争议或出版流程戏剧。
    keywords: [academic integrity, research misconduct, plagiarism, fabricated citation, fake citation, retraction, peer review drama, reviewer dispute, publication ethics, image manipulation, authorship dispute]
  - name: 中文内容
    reason: 主号纯英文；中文另走独立渠道。
    rule: lang != "en"
  - name: 体育与博彩结果
    reason: 不属于科学研究方向。
    keywords: [world cup, who will win, betting odds, football, soccer, sports bet]
  - name: 个人生活与活动吆喝
    reason: 没有科研选题或专业互动价值。
    keywords: [morning run, happy birthday, good morning, giveaway, we are live, tune in, come join]
  - name: 竞品自吹与骂战
    reason: 不硬蹭 launch，不参与衰败叙事或互撕。
    keywords: [we just shipped, excited to launch, excited to announce, proud to announce, don't be like, despise]
  - name: 求职择校与会议行政
    reason: 不是科研决策问题。
    keywords: [job market, career advice, grad school, graduate school, universities for, hiring managers, conference deadline, reviews are out, rebuttal deadline]
