# Product-led editorial contract.
# External signals may supply timing, stakes, conflict, or a real case. They may
# not invent an Apodex thesis. Every retained original must match one problem
# shape and one owned thesis below.
#
# 母问题（root_question）是本 contract 的第 0 层：所有栏目、母题、问题形态与
# thesis 最终都要收口回同一句。八个 thesis 并列等于没有母问题 —— 那是内容"散"的
# 结构性原因，不是算子不够。
#
# 算子层（"这条怎么写"）见 config/operators.yml。

root_question:
  RQ_who_checked:
    text_en: "Who checked this — other than the person who made it?"
    text_zh: "除了做出这个判断的人，还有谁检查过它？"
    close_phrase_zh: "这个判断有没有资格被相信"
    close_phrase_note: |
      注意不是"对不对"。出处：Apodex Verification 内部文件《TracesA 与 TracesB》——
      Verifier 只做结构性验证，不判断答案真伪。对外表述必须保持这个边界。
    audience: |
      学术 PI / 实验室负责人 / 深科技研究者 / 量化研究者。
      依据 Frontier Program 落地页 Who We Support 与战略文件 A1 范围
      （全部 STEM 学科：生物医药、材料、能源、化学、物理、计算机）。
    natural_adversary: "自评（self-review）。母问题的张力来自这里。"
    report_backing:
      - "Technical Report §3.1 — verification proceeds not as introspection but as an external check by agents uninvolved in the process under review"
      - "Technical Report §1 — self-reflection degrades with each additional turn"
      - "Frontier Program 落地页 — independent verification"
    sub_question:
      text_zh: "你的结论里，少了哪一个你没想到的对照？"
      text_en: "What is the control you did not think of?"
      note: "对应 Verifier 的 Alternatives 维度。E1 引擎（EI6）的收口句。"

# 金融赛道（ECOA / Reg B / AML / 信贷）另有母问题，与 RQ_who_checked 语法不同。
# 战略文件明确两条赛道各自独立执行、不合并计算，故本 contract 当前仅服务科学研究赛道。
# 开金融线需另立 root_question，不得混入同一排期。
scope:
  active_track: science_research
  excluded_track:
    finance: "需另立 root_question 与独立排期；混发会互相稀释受众"

operators_ref: config/operators.yml
confound_library_ref: config/confound_library.yml
forms_ref: config/forms.yml
axes_ref: config/axes.yml

columns:
  C1:
    name: "Problem-aware｜现实中的难题形态"
    scrapable: true
    purpose: "用当下真实事件呈现官网同构问题：多来源、条件化、无单一现成答案。"
  C2:
    name: "Design Choice｜为什么 Apodex 这样设计"
    scrapable: true
    purpose: "从技术报告中的已确认设计选择出发；外部信号只提供 timing、案例或 stakes。"
  C3:
    name: "Before It Becomes Official｜定稿之前"
    scrapable: true
    purpose: "只接仍开放的 draft、consultation、call for evidence、advisory 或 proposed rule。"
  C4:
    name: "Worldview｜难题应该怎样被解决"
    scrapable: false
    purpose: "Selene 供料的长期世界观；外部管线不得自动生成。"
  C5:
    name: "Claim vs Record｜公开说法 vs 正式记录"
    scrapable: false
    paused: true
    purpose: "本阶段暂停，避免重新滑向 proof、benchmark 与泛 fact-check。"
  C6:
    name: "Social Proof｜#ApodexSolvers"
    scrapable: false
    purpose: "只接 Selene 确认可公开的 demo、用户案例或内部物料。"
  C8:
    name: "Engagement｜圈内接话"
    scrapable: false
    purpose: "仅为互动归宿；不能与原创栏目同时出现。"

problem_shapes:
  PS1_evidence_shift:
    name: "新证据改变原来的答案"
    keywords:
      - updated guidance
      - label change
      - new safety information
      - revised estimate
      - updated assessment
      - warning added
      - warning removed
  PS2_credible_conflict:
    name: "两个可信来源给出冲突结论"
    keywords:
      - conflicting evidence
      - mixed findings
      - insufficient evidence
      - no consensus
      - disagreement between
      - evidence remains uncertain
  PS3_conditional_decision:
    name: "判断取决于条件、阈值与可观察信号"
    keywords:
      - under what conditions
      - what signals
      - depends on whether
      - risk benefit
      - scenario analysis
      - threshold for
      - decision criteria
  PS4_fragmented_record:
    name: "证据分散在多个独立系统"
    keywords:
      - registry
      - official record
      - multiple sources
      - evidence synthesis
      - cross-jurisdiction
      - longitudinal evidence
  PS5_definition_boundary:
    name: "定义、纳入与排除条件改变答案集合"
    keywords:
      - official definition
      - eligibility criteria
      - inclusion criteria
      - what counts as
      - classified as
      - formal designation
      - scope of the rule
      - excluded from
  PS6_moving_target:
    name: "研究过程中现实仍在变化"
    keywords:
      - draft guidance
      - call for evidence
      - public consultation
      - proposed rule
      - advisory committee
      - ongoing investigation
      - closing date
  PS7_branching_investigation:
    name: "一个问题分出多个独立调查分支"
    keywords:
      - multi-source investigation
      - several scenarios
      - competing explanations
      - multiple jurisdictions
      - evidence across
  PS8_auditable_conclusion:
    name: "结论需要可追溯、可修订、可分叉的研究历史"
    keywords:
      - correction
      - revised conclusion
      - audit trail
      - source provenance
      - postmortem
      - root cause
  PS9_source_collapse:
    name: "很多引用最终坍缩到同一个来源"
    keywords:
      - based on a press release
      - single source
      - source diversity
      - widely reported
      - syndicated
  PS10_missing_control:
    name: "结论没有排除掉替代解释"
    intake: curated
    source: config/confound_library.yml
    keywords:
      - reporting standard
      - reporting guidelines
      - author checklist
      - round robin
      - interlaboratory
      - confounder
      - sham control
      - negative control
      - normalization basis
      - baseline comparison
    hard_gate:
      note: |
        E1 引擎的反退化闸门。以下五项缺一即拒 —— 这使"科学不可复现""某领域方法
        论文导读"这类泛叙事在结构上无法进入（它们填不出 reported_metric 与 confound）。
      required_fields:
        - discipline
        - reported_metric
        - confound
        - control_or_report_item
        - standard_source
    operator_fit:
      - OP1_constant_falsified
      - OP2_term_inflation_audit
      - OP4_measurement_collapse
      - OP5_incentive_misalignment_audit
      - OP8_primary_document_raid
      - OP9_source_collapse_parable
      - OP11_boundary_self_disclosure
  PS11_cross_field_isomorphism:
    name: "两个学科的难题在计算范式上是同一个问题"
    intake: curated
    source: "战略文件 A1 —— 材料/能源的结构-性能优化与蛋白质/AAV 结构优化在计算范式上高度相似，技术栈可复用"
    keywords:
      - structure property optimization
      - high dimensional search
      - expensive validation
      - transferable method
      - same computational shape
    operator_fit:
      - OP1_constant_falsified
      - OP2_term_inflation_audit
      - OP9_source_collapse_parable
      - OP11_boundary_self_disclosure

theses:
  T1_single_pass_ceiling:
    name: "一次生成装不下一次调查"
    report_source: "Technical Report §1"
    allowed_columns: [C1, C2]
    problem_shapes: [PS4_fragmented_record, PS6_moving_target, PS7_branching_investigation]
  T2_independent_verification:
    name: "验证必须由独立角色完成"
    report_source: "Technical Report §3.1"
    root_question: RQ_who_checked
    allowed_columns: [C1, C2]
    problem_shapes: [PS2_credible_conflict, PS5_definition_boundary, PS8_auditable_conclusion, PS10_missing_control]
  T3_asynchronous_verification:
    name: "验证应在研究过程中推进"
    report_source: "Technical Report §3.2"
    allowed_columns: [C1, C2, C3]
    problem_shapes: [PS1_evidence_shift, PS6_moving_target, PS8_auditable_conclusion]
  T4_evidence_graph:
    name: "结论应建立在 support 与 contradiction 的证据图上"
    report_source: "Technical Report §4.1"
    allowed_columns: [C1, C2]
    problem_shapes: [PS2_credible_conflict, PS3_conditional_decision, PS4_fragmented_record]
  T5_source_diversity:
    name: "很多答案或引用不等于独立证据"
    report_source: "Technical Report §4.1"
    allowed_columns: [C1, C2]
    problem_shapes: [PS2_credible_conflict, PS9_source_collapse]
  T6_auditable_history:
    name: "结论应可审计、撤回、修订和分叉"
    report_source: "Technical Report §3.2"
    allowed_columns: [C1, C2, C3]
    problem_shapes: [PS1_evidence_shift, PS6_moving_target, PS8_auditable_conclusion]
  T7_agent_level_scaling:
    name: "扩展调查分支，而不只扩展参数"
    report_source: "Technical Report §3.3"
    allowed_columns: [C1, C2]
    problem_shapes: [PS4_fragmented_record, PS7_branching_investigation]
  T8_search_judgment_loop:
    name: "新证据改写计划，计划决定下一次搜索"
    report_source: "Technical Report §6.1"
    allowed_columns: [C1, C2]
    problem_shapes: [PS1_evidence_shift, PS3_conditional_decision, PS4_fragmented_record]
  T9_cross_domain_synthesis:
    name: "跨领域证据综合：一个领域的成熟解法搬到另一个领域"
    report_source: "Frontier Program 落地页 — cross-domain evidence synthesis；战略文件 A1 技术栈复用"
    backing_note: |
      本 thesis 的一手背书是官网/落地页而非技术报告章节，故使用它的候选
      capability_backing 应填 website。材料/能源目前在落地页 Where We've Gone
      Deepest 中没有案例，写这两科时能力表述只能引落地页原句：
      "The examples above reflect our current depth of validation, not the
      boundaries of what's possible."
    allowed_columns: [C1, C2]
    problem_shapes: [PS11_cross_field_isomorphism, PS4_fragmented_record]

signal_roles:
  timing: "为既定母题提供当下性"
  real_case: "提供有公开证据的真实案例"
  stake: "说明错误或遗漏的现实后果"
  conflict: "提供两个可核证据链之间的冲突"
  update: "提供会改变原判断的新证据"
  decision_window: "提供仍开放的决策或反馈窗口"
  interaction: "只适合原平台互动"

capability_backing:
  - website
  - technical_report
  - demo
  - owner_confirmed

actions:
  original_post:
    platforms: [x, reddit, rss, web]
  x_reply:
    platforms: [x]
  x_quote:
    platforms: [x]
  reddit_reply:
    platforms: [reddit]
  watch:
    platforms: [x, reddit, rss, web]

# Deterministic exclusions are intentionally narrow. The Judge handles semantic
# exclusions such as competitor launches and paper-only material.
exclude:
  - name: "vertical troubleshooting"
    keywords:
      - next experiment
      - which assay
      - protocol help
      - pipeline stuck
      - clustering help
      - genome annotation help
      - scrna clustering
      - rna-seq pipeline
  - name: "proof series paused"
    keywords:
      - leaderboard
      - state of the art benchmark
      - benchmark score
      - pass@1
  - name: "academic integrity excluded"
    keywords:
      - academic misconduct
      - paper mill
      - plagiarism allegation
      - peer review fraud
