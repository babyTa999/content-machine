# 采集源配置 —— 本文件真正驱动 collect.py（2026-07-24 A 方案：配置化）
# collect.py 读每个源的 status + 参数。status: auto 才采；staged/off 跳过（真跳过，不是文档）。
# 改这里 = 改采集行为。解析逻辑（RSS/Jina/arXiv XML）仍在 python，不在这。
# method 仅标注用途；驱动靠 status + 下面的参数。

# ========== ① 难题求解：ICP 真实硬难题 ==========

practitioner_pain_reddit:            # 从业者直接问痛（safe-social 只读）
  method: safe-social reddit search  # ⚠️safe-social 封了 sub 命令→改 search "subreddit:X <痛点词>"
  status: auto
  sort: top                          # 拉高赞经典，不看"最近谁发帖"的运气
  time: year                         # 痛点常青，取一年内高赞真金
  limit_per_query: 12
  pain_query: '(help OR error OR problem OR "how do I" OR verify OR reproducibility OR broken OR wrong)'
  subs:                              # 分 ICP 组——采集给帖子带 icp（比关键词准）
    Apodex4Science: [bioinformatics, computationalbiology, chemistry, statistics]
    Apodex4DeepTech: [MLQuestions, datascience, MachineLearning]
  note: 只取有 S.O.S./Help/[Q]/[R] 求助文化的技术版；已砍 labrats/AskAcademia/biotech/PhD/LocalLLaMA/MaterialsScience。

arxiv:                               # 收窄(2026-07-24 B)：只留"AI 失败/不可靠"研究——arxiv 唯一喂得动②的东西
  method: curl                       # 方法/成果论文 4 组 query 全删(judge Q0 本就全砍、纯拖慢+限流)
  status: auto
  window_h: 168
  max_results: 12
  queries:                           # 只抓揭示 LLM/agent 失败模式/不可靠/局限的研究，非"提出新方法"的 showcase
    ai-failure-modes: '(cat:cs.AI OR cat:cs.CL OR cat:cs.LG) AND (abs:hallucination OR abs:unreliable OR abs:"fails to" OR abs:overconfident OR abs:"not robust" OR abs:brittle OR abs:"silently wrong") AND (abs:LLM OR abs:"language model" OR abs:agent OR abs:"deep research")'

prediction_banks:                    # Metaculus 预测题（含预测切面 7+5 类）
  method: jina                       # REST API 已 403(2026-07)→Jina 抓搜索页 #### [title](url)
  status: auto
  url: 'https://www.metaculus.com/questions/?order_by=-activity&status=open&search=AI+science+drug+protein+climate+biology'
  note: SSPP(DellaVigna 1482 题) / FDA PDUFA 日历待接。

official_challenges:                 # 官方悬赏 = ICP 的痛，明写
  method: jina                       # Jina 抓页链接 + 路径过滤
  status: auto
  pages:
    USAgov: https://www.usa.gov/find-active-challenge
    XPRIZE: https://www.xprize.org/prizes
    ARPA-H: https://arpa-h.gov/research-and-funding
  note: 路径过滤(usa.gov /challenges/·xprize /competitions/·arpa-h /programs|open-funding；跳图片)硬编码在 collect；NSF/DARPA 后续加页面。

# ⛔ review_open_questions 已砍(2026-07-24)：搜 open-question+review 出的是自秀方法论文，非 problem-first。

# ========== ② 验证拆解：AI 在 science/deeptech 闯祸的真实事件 ==========

ai_incident_db:                      # Google News RSS（免费无 key），ICP 镜头
  method: google_news_rss
  status: auto
  per_query: 8
  queries:                           # ⚠️ 只锚 science/deeptech；判官 ICP 闸砍客服/消费噪音
    - AI fabricated research data retraction
    - AI hallucinated citation scientific paper
    - deep research AI unreliable wrong conclusion
    - AI benchmark data leakage flawed evaluation
    - AI drug discovery materials prediction wrong
  note: s.jina.ai/Exa 已需 key（2026-07）；Google News RSS 免费替代。X 带截图翻车后续接。

journal_rss:                         # bio/science 新闻 + 撤稿（含 Retraction Watch）
  method: rss
  status: auto
  limit_per_feed: 15
  feeds:
    Nature: https://www.nature.com/nature.rss
    NatureComms: https://www.nature.com/ncomms.rss
    Science: https://www.science.org/rss/news_current.xml
    RetractionWatch: https://retractionwatch.com/feed/

# ⛔ 法律 AI 幻觉判例(Charlotin) —— Selene 已写过；pillars exclude + 判官双拦，不采。

# ========== ④ 圈内接话（只 X）==========

x_watchlist:                         # 个人 + 机构官号，见 watchlist.yml
  method: safe-social x
  status: auto
  posts_per_handle: 10
  window_h_individual: 48            # 接话要鲜
  window_h_institution: 168          # 机构官号当选题素材
  note: (a)共鸣顺势自陈 / (b)痛点荐己，不夸不踩。

x_keyword_search:                    # 捞非 watchlist 的生人真实抱怨/争论/翻车 → 判官判①(原创难题)或④(接话)
  method: safe-social x search
  status: auto
  per_query: 6
  window_h: 336                      # 14 天宽窗；接话鲜度由判官判（痛点常青）
  min_engagement: 5                  # 过滤零互动噪音（生人搜索噪音多）
  queries:
    resonance: ["verification matters", "cannot trust AI output", "reproducibility crisis", "AI confidently wrong"]
    pain: ["AI hallucinated a citation", "how do I verify AI", "AI made up a number", "spent hours verifying AI"]
  note: ⚠️@kw90qk 只读、拉开间隔别连甩(限流)、别用 macOS 无的 timeout。monid(B $0.0006/条不碰号)备选。

# ========== 基础源 ==========

hackernews:                          # front_page AI，偶有 incident/痛点
  method: curl
  status: auto
  query: AI
  hits: 8

hf_papers:                           # 降权——论文源，judge 不自动留
  method: curl
  status: auto
  limit: 8
