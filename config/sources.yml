# Oracle 外部母库配置（science track）
# status: auto 才采集；staged 只占位；manual 由 Selene 供料且不进入 repo。

state:
  cross_day_dedupe_days: 45
  story_dedupe_days: 14
  dynamic_watch_limit: 20

recall:
  source_priority:
    x: 6
    reddit: 4
    rss: 2
    web: 1
  max_enrichment_candidates: 32

enrichment:
  x_method: safe-social x tweet
  reddit_method: safe-social reddit read
  web_method: jina reader
  max_chars: 12000

# X 四路并行：静态 watchlist、任务型 Top+Latest、对话图、动态账号池。
x_watchlist:
  method: safe-social x user-posts
  status: auto
  posts_per_handle: 12
  window_h_individual: 72
  window_h_institution: 168
  request_interval_s: 1.2

x_keyword_search:
  method: safe-social x search
  status: auto
  lang: en
  exclude: [retweets]
  request_interval_s: 2.0
  modes:
    Top:
      per_query: 10
      window_h: 336
      min_engagement: 5
    Latest:
      per_query: 14
      window_h: 96
      min_engagement: 0
  queries:
    research_decisions:
      - '"next experiment" (biology OR chemistry OR materials OR neuroscience)'
      - '"experimental design" (lab OR scientist OR research)'
      - '"which method" (assay OR protocol OR experiment OR analysis)'
    evidence_conflicts:
      - '"conflicting results" (experiment OR dataset OR assay)'
      - '"unexpected result" (lab OR experiment OR analysis)'
      - '"data discrepancy" (research OR experiment OR analysis)'
    workflow_friction:
      - '"research workflow" (tool OR database OR pipeline)'
      - '"analysis pipeline" (stuck OR error OR unexpected)'
      - '"failed experiment" (help OR why OR troubleshooting)'
    science_signals:
      - '"AI for science" (experiment OR lab OR discovery)'
      - '"scientific reasoning" (evaluation OR evidence OR experiment)'
      - '"new dataset" (biology OR chemistry OR materials OR physics)'

x_conversation_graph:
  method: safe-social x search --to
  status: auto
  mode: Latest
  handles_per_run: 8
  per_handle: 12
  window_h: 72
  min_engagement: 1
  request_interval_s: 2.0
  note: 每天轮换 watchlist seed，读取回复者与 quote chain；只扩大召回，不自动互动。

x_dynamic_watch:
  method: safe-social x user-posts
  status: auto
  posts_per_handle: 10
  window_h: 168
  request_interval_s: 1.2
  note: 账号来自 repo 外 SQLite；只有多日稳定命中并经 Evidence Judge 留下的账号才晋级。

# Reddit 同时取高质量常青讨论和近期讨论；既可做回复，也可做原创选题 seed。
reddit_discovery:
  method: safe-social reddit search
  status: auto
  request_interval_s: 1.5
  modes:
    - {sort: top, time: year, limit: 12}
    - {sort: new, time: month, limit: 12}
  query_rotation_per_sub: 1
  queries:
    - '(help OR "how do" OR "which method" OR "what would you do" OR "next experiment")'
    - '(protocol OR assay OR pipeline OR analysis OR dataset) (issue OR discrepancy OR unexpected OR stuck)'
    - '(experiment OR simulation OR measurement) (failed OR confusing OR conflicting OR troubleshooting)'
  communities:
    life_sciences: [bioinformatics, computationalbiology, labrats, neuroscience, genetics, biotech]
    chemistry_materials: [chemistry, MaterialsScience]
    scientific_computing: [statistics, datascience, MachineLearning]

# RSS/News 只是及时线索；“新发布”本身没有选题价值。
science_rss:
  method: rss
  status: auto
  limit_per_feed: 18
  feeds:
    Nature: https://www.nature.com/nature.rss
    Science: https://www.science.org/rss/news_current.xml

science_news:
  method: google_news_rss
  status: auto
  per_query: 6
  queries:
    - scientific research experimental design data challenge
    - research lab workflow dataset tool problem
    - biology chemistry materials experiment unexpected result
    - scientific AI laboratory decision evidence

prediction_banks:
  method: jina
  status: auto
  url: 'https://www.metaculus.com/questions/?order_by=-activity&status=open&search=science+drug+protein+climate+biology+materials'

official_challenges:
  method: jina
  status: auto
  pages:
    USAgov: https://www.usa.gov/find-active-challenge
    XPRIZE: https://www.xprize.org/prizes
    ARPA-H: https://arpa-h.gov/research-and-funding

hackernews:
  method: api
  status: auto
  query: scientific research tools
  hits: 8

official_records:
  status: staged
  note: 官方数据库留待下一次专项讨论后再配置；当前 Judge 不得把新闻线索伪装成正式记录。

owned_materials:
  status: manual
  note: 所有内部物料由 Selene 提供；不保存内部路径、原文、截图、数字或产品承诺。
