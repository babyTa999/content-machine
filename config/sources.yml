# Oracle external signal library.
# External material supplies timing, a real case, stakes, conflict, or an
# update. It does not define the Apodex thesis.

state:
  cross_day_dedupe_days: 45
  story_dedupe_days: 14
  narrative_cooldown_days: 30
  dynamic_watch_limit: 4

recall:
  source_role_priority:
    official_record: 8
    institutional_update: 7
    primary_report: 6
    expert_primary_link: 5
    reputable_news_lead: 3
    community_case_lead: 2
    paper_abstract_only: 1
    anonymous_opinion: 0
  max_enrichment_candidates: 32
  enrichment_budgets:
    official_update: 10
    x: 8
    decision_window: 6
    rss_news: 5
    community: 3

enrichment:
  x_method: safe-social x tweet
  reddit_method: safe-social reddit read
  web_method: jina reader
  max_chars: 12000

source_role_rules:
  official_update: official_record
  official_federalreserve: institutional_update
  official_challenge: official_record
  prediction_bank: primary_report
  google_news_signal: reputable_news_lead
  rss_nature: paper_abstract_only
  rss_science: reputable_news_lead
  hackernews: community_case_lead

x_watchlist:
  method: safe-social x user-posts
  status: auto
  handles_per_run: 12
  posts_per_handle: 12
  window_h_individual: 72
  window_h_institution: 168
  request_interval_s: 4.0
  note: "优先机构、监管者、标准组织、可信专家；账号价值与互动资格分开判断。"

x_keyword_search:
  method: safe-social x search
  status: auto
  intent_groups_per_run: 5
  lang: en
  exclude: [retweets]
  request_interval_s: 4.0
  modes:
    Top:
      per_query: 10
      window_h: 336
      min_engagement: 5
    Latest:
      per_query: 14
      window_h: 96
      min_engagement: 0
  query_source: config/editorial_intents.yml
  note: "只执行 editorial intent 中的具体 event queries；本文件不再维护抽象 problem-shape query。"

x_conversation_graph:
  method: safe-social x search --to
  status: disabled
  mode: Latest
  handles_per_run: 4
  per_handle: 12
  window_h: 72
  min_engagement: 1
  request_interval_s: 4.0
  note: "已关闭：实测主要召回模型发布争吵、随口回复与 benchmark 评论。"

x_dynamic_watch:
  method: safe-social x user-posts
  status: auto
  posts_per_handle: 10
  window_h: 168
  request_interval_s: 4.0
  note: "只晋级多日稳定贡献官网同构问题或一手信号的账号。"

# Reddit 只提供 pain language 与 case lead。匿名内容不能直接成为官号案例。
reddit_discovery:
  method: safe-social reddit search
  status: disabled
  request_interval_s: 1.5
  modes:
    - {sort: top, time: year, limit: 8}
    - {sort: new, time: month, limit: 10}
  query_rotation_per_sub: 1
  queries:
    - '("conflicting advice" OR "information changed" OR "cannot find a clear answer")'
    - '("official source" OR "what counts as" OR "under what conditions")'
    - '("real-world consequence" OR "decision changed" OR "new evidence")'
  communities:
    decisions_and_policy: [AskEconomics, publichealth, medicine, Law]
    research_practice: [AskAcademia, science, askscience]
    technology_practice: [technology, ExperiencedDevs]
  evidence_role: community_case_lead
  lead_only: true
  note: "已停用：top/year 结果过旧，当前不进入每日日报采集。"

# Papers/news are leads only. They cannot independently create Product-aware.
science_rss:
  method: rss
  status: auto
  limit_per_feed: 12
  lead_only: true
  feeds:
    Nature:
      url: https://www.nature.com/nature.rss
      evidence_role: paper_abstract_only
    Science:
      url: https://www.science.org/rss/news_current.xml
      evidence_role: reputable_news_lead

signal_news:
  method: google_news_rss
  status: disabled
  per_query: 5
  queries:
    - '"updated guidance" OR "label change" official'
    - '"conflicting evidence" regulator OR guideline'
    - '"call for evidence" OR "public consultation" science OR technology OR health'
    - '"revised estimate" OR "updated assessment" policy OR economy OR medicine'
  note: "已停用：实测 20 条中 17 条超过 7 天，中位年龄约 155 天。"

# Stable first-party sources. Index pages are parsed into individual update links.
official_indexes:
  method: jina_index
  status: auto
  limit_per_page: 20
  pages:
    FDA_Drug_Safety:
      url: https://www.fda.gov/drugs/drug-safety-and-availability/drug-safety-communications
      allow_hosts: [fda.gov]
      include_paths: [/drugs/drug-safety-and-availability/]
      evidence_role: official_record
      signal_group: evidence_shift
    FDA_Drug_Alerts:
      url: https://www.fda.gov/drugs/drug-safety-and-availability/drug-alerts-and-statements
      allow_hosts: [fda.gov]
      include_paths: [/drugs/drug-safety-and-availability/]
      evidence_role: official_record
      signal_group: evidence_shift
    EU_Have_Your_Say:
      url: https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives_en
      allow_hosts: [ec.europa.eu]
      include_paths: [/info/law/better-regulation/have-your-say/initiatives/]
      evidence_role: official_record
      signal_group: decision_window

official_feeds:
  method: rss
  status: auto
  limit_per_feed: 18
  feeds:
    FederalReserve:
      url: https://www.federalreserve.gov/feeds/press_all.xml
      evidence_role: institutional_update
      signal_group: conditional_decision

prediction_banks:
  method: jina
  status: auto
  url: "https://www.metaculus.com/questions/?order_by=-activity&status=open&search=health+policy+economy+climate+technology"

official_challenges:
  method: jina
  status: auto
  pages:
    USAgov: https://www.usa.gov/find-active-challenge
    XPRIZE: https://www.xprize.org/prizes
    ARPA-H: https://arpa-h.gov/research-and-funding

hackernews:
  method: api
  status: staged
  query: research decision evidence
  hits: 6
  note: "watch-only；不直接形成原创。"

owned_materials:
  status: manual
  note: "技术报告、官网、demo 与 owner-confirmed 事实只由 Selene 供料；外部来源不得改写产品能力。"
